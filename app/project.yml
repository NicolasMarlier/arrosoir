name: Arrosoir
options:
  bundleIdPrefix: com.nicolasmarlier
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Arrosoir.xcconfig
  Release: Config/Arrosoir.xcconfig
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.30.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ZBL8NZ2ZE7
    CODE_SIGN_STYLE: Automatic
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Arrosoir:
    type: application
    platform: iOS
    sources:
      - path: Arrosoir
    dependencies:
      - package: Sentry
        product: Sentry
    postBuildScripts:
      - name: Envoi des dSYM à Sentry
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
        script: |
          # Symbolication des crashs. Nécessite sentry-cli (brew install getsentry/tools/sentry-cli)
          # et un jeton (SENTRY_AUTH_TOKEN dans ~/.sentryclirc ou l'environnement). Sinon : ignoré.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" SENTRY_URL
          [ -z "$SENTRY_ORG" ] && exit 0
          [ "$PLATFORM_NAME" = "iphonesimulator" ] && exit 0
          command -v sentry-cli >/dev/null || { echo "warning: sentry-cli absent, dSYM non envoyés"; exit 0; }
          sentry-cli --org "$SENTRY_ORG" debug-files upload --include-sources --project "$SENTRY_PROJECT" "$DWARF_DSYM_FOLDER_PATH" || echo "warning: envoi des dSYM raté"
    info:
      path: Arrosoir/Info.plist
      properties:
        UIAppFonts:
          - BricolageGrotesque-Regular.ttf
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
        SentryDSN: $(SENTRY_DSN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasmarlier.arrosoir
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Arrosoir
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: "Pour photographier tes plantes et les reconnaître."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pour décrire ta plante à voix haute lors d'un diagnostic."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Pour transcrire ta description sur ton iPhone."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pour choisir une photo de ta plante."
        INFOPLIST_KEY_CFBundleDevelopmentRegion: fr
  ArrosoirTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArrosoirTests
    dependencies:
      - target: Arrosoir
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasmarlier.arrosoir.tests
schemes:
  Arrosoir:
    build:
      targets:
        Arrosoir: all
        ArrosoirTests: [test]
    test:
      targets:
        - ArrosoirTests
